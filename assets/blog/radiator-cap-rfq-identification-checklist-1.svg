<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img"><rect width="900" height="420" rx="20" fill="#edf3f8"/><text x="36" y="48" font-family="Arial" font-size="25" font-weight="bold" fill="#17364c">Radiator-cap identification: record separate fields</text><rect x="30" y="85" width="270" height="240" rx="12" fill="white" stroke="#9db7c7"/><text x="48" y="124" font-family="Arial" font-size="20" font-weight="bold" fill="#076c79">Reference</text><text x="48" y="168" font-family="Arial" font-size="18" fill="#223c50">Complete part number</text><text x="48" y="204" font-family="Arial" font-size="18" fill="#223c50">Letters and suffixes</text><text x="48" y="240" font-family="Arial" font-size="18" fill="#223c50">Source of the number</text><rect x="320" y="85" width="270" height="240" rx="12" fill="white" stroke="#9db7c7"/><text x="338" y="124" font-family="Arial" font-size="20" font-weight="bold" fill="#076c79">Marked specification</text><text x="338" y="168" font-family="Arial" font-size="18" fill="#223c50">Copy pressure marking</text><text x="338" y="204" font-family="Arial" font-size="18" fill="#223c50">Keep its unit</text><text x="338" y="240" font-family="Arial" font-size="18" fill="#223c50">Do not infer application</text><rect x="610" y="85" width="270" height="240" rx="12" fill="white" stroke="#9db7c7"/><text x="628" y="124" font-family="Arial" font-size="20" font-weight="bold" fill="#076c79">Vehicle details</text><text x="628" y="168" font-family="Arial" font-size="18" fill="#223c50">Known make and model</text><text x="628" y="204" font-family="Arial" font-size="18" fill="#223c50">Year and engine</text><text x="628" y="240" font-family="Arial" font-size="18" fill="#223c50">Identification if available</text><text x="36" y="370" font-family="Arial" font-size="18" fill="#344d60">One field alone is not a complete specification.</text></svg>