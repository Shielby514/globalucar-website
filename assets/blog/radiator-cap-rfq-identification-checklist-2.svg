<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img"><rect width="900" height="420" rx="20" fill="#edf3f8"/><text x="36" y="48" font-family="Arial" font-size="25" font-weight="bold" fill="#17364c">Photographs to request for an identification review</text><rect x="30" y="85" width="270" height="240" rx="12" fill="white" stroke="#9db7c7"/><text x="48" y="124" font-family="Arial" font-size="20" font-weight="bold" fill="#076c79">Top view</text><text x="48" y="168" font-family="Arial" font-size="18" fill="#223c50">Readable markings</text><text x="48" y="204" font-family="Arial" font-size="18" fill="#223c50">Complete visible top</text><text x="48" y="240" font-family="Arial" font-size="18" fill="#223c50">No cropped identity</text><rect x="320" y="85" width="270" height="240" rx="12" fill="white" stroke="#9db7c7"/><text x="338" y="124" font-family="Arial" font-size="20" font-weight="bold" fill="#076c79">Underside view</text><text x="338" y="168" font-family="Arial" font-size="18" fill="#223c50">Sealing area visible</text><text x="338" y="204" font-family="Arial" font-size="18" fill="#223c50">Clear, focused image</text><text x="338" y="240" font-family="Arial" font-size="18" fill="#223c50">Same item as top view</text><rect x="610" y="85" width="270" height="240" rx="12" fill="white" stroke="#9db7c7"/><text x="628" y="124" font-family="Arial" font-size="20" font-weight="bold" fill="#076c79">Packaging</text><text x="628" y="168" font-family="Arial" font-size="18" fill="#223c50">Readable label</text><text x="628" y="204" font-family="Arial" font-size="18" fill="#223c50">Keep original reference</text><text x="628" y="240" font-family="Arial" font-size="18" fill="#223c50">State missing evidence</text><text x="36" y="370" font-family="Arial" font-size="18" fill="#344d60">This is an evidence checklist, not a drawing of a particular cap.</text></svg>