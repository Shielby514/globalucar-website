<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1010" role="img"><rect width="420" height="1010" rx="16" fill="#edf3f8"/><text x="22" y="35" font-family="Arial" font-size="23" font-weight="bold" fill="#17364c">Photographs to request for an</text><text x="22" y="63" font-family="Arial" font-size="23" font-weight="bold" fill="#17364c">identification review</text><rect x="20" y="125" width="380" height="220" rx="12" fill="white" stroke="#9db7c7"/><text x="40" y="167" font-family="Arial" font-size="22" fill="#076c79">Top view</text><text x="40" y="210" font-family="Arial" font-size="20" fill="#076c79">Readable markings</text><text x="40" y="253" font-family="Arial" font-size="20" fill="#076c79">Complete visible top</text><text x="40" y="296" font-family="Arial" font-size="20" fill="#076c79">No cropped identity</text><rect x="20" y="370" width="380" height="220" rx="12" fill="white" stroke="#9db7c7"/><text x="40" y="412" font-family="Arial" font-size="22" fill="#076c79">Underside view</text><text x="40" y="455" font-family="Arial" font-size="20" fill="#076c79">Sealing area visible</text><text x="40" y="498" font-family="Arial" font-size="20" fill="#076c79">Clear, focused image</text><text x="40" y="541" font-family="Arial" font-size="20" fill="#076c79">Same item as top view</text><rect x="20" y="615" width="380" height="220" rx="12" fill="white" stroke="#9db7c7"/><text x="40" y="657" font-family="Arial" font-size="22" fill="#076c79">Packaging</text><text x="40" y="700" font-family="Arial" font-size="20" fill="#076c79">Readable label</text><text x="40" y="743" font-family="Arial" font-size="20" fill="#076c79">Keep original reference</text><text x="40" y="786" font-family="Arial" font-size="20" fill="#076c79">State missing evidence</text><text x="22" y="905" font-family="Arial" font-size="19" fill="#344d60">This is an evidence checklist, not</text><text x="22" y="933" font-family="Arial" font-size="19" fill="#344d60">a drawing of a particular cap.</text></svg>