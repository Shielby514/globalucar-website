<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img"><rect width="900" height="420" rx="20" fill="#edf3f8"/><text x="36" y="48" font-family="Arial" font-size="25" font-weight="bold" fill="#17364c">From enquiry to a product-specific quotation</text><rect x="30" y="85" width="270" height="240" rx="12" fill="white" stroke="#9db7c7"/><text x="48" y="124" font-family="Arial" font-size="20" font-weight="bold" fill="#076c79">Buyer request</text><text x="48" y="168" font-family="Arial" font-size="18" fill="#223c50">Reference and quantity</text><text x="48" y="204" font-family="Arial" font-size="18" fill="#223c50">Photo filenames</text><text x="48" y="240" font-family="Arial" font-size="18" fill="#223c50">Unresolved questions</text><rect x="320" y="85" width="270" height="240" rx="12" fill="white" stroke="#9db7c7"/><text x="338" y="124" font-family="Arial" font-size="20" font-weight="bold" fill="#076c79">Supplier review</text><text x="338" y="168" font-family="Arial" font-size="18" fill="#223c50">Proposed full reference</text><text x="338" y="204" font-family="Arial" font-size="18" fill="#223c50">Catalogue check</text><text x="338" y="240" font-family="Arial" font-size="18" fill="#223c50">Specification confirmation</text><rect x="610" y="85" width="270" height="240" rx="12" fill="white" stroke="#9db7c7"/><text x="628" y="124" font-family="Arial" font-size="20" font-weight="bold" fill="#076c79">Quotation</text><text x="628" y="168" font-family="Arial" font-size="18" fill="#223c50">Quantity and unit</text><text x="628" y="204" font-family="Arial" font-size="18" fill="#223c50">Commercial terms</text><text x="628" y="240" font-family="Arial" font-size="18" fill="#223c50">Remaining uncertainty</text><text x="36" y="370" font-family="Arial" font-size="18" fill="#344d60">Similar appearance or pressure marking does not establish interchangeability.</text></svg>