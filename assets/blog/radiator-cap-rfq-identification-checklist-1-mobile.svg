<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1010" role="img"><rect width="420" height="1010" rx="16" fill="#edf3f8"/><text x="22" y="35" font-family="Arial" font-size="23" font-weight="bold" fill="#17364c">Radiator-cap identification:</text><text x="22" y="63" font-family="Arial" font-size="23" font-weight="bold" fill="#17364c">record separate fields</text><rect x="20" y="125" width="380" height="220" rx="12" fill="white" stroke="#9db7c7"/><text x="40" y="167" font-family="Arial" font-size="22" fill="#076c79">Reference</text><text x="40" y="210" font-family="Arial" font-size="20" fill="#076c79">Complete part number</text><text x="40" y="253" font-family="Arial" font-size="20" fill="#076c79">Letters and suffixes</text><text x="40" y="296" font-family="Arial" font-size="20" fill="#076c79">Source of the number</text><rect x="20" y="370" width="380" height="220" rx="12" fill="white" stroke="#9db7c7"/><text x="40" y="412" font-family="Arial" font-size="22" fill="#076c79">Marked specification</text><text x="40" y="455" font-family="Arial" font-size="20" fill="#076c79">Copy pressure marking</text><text x="40" y="498" font-family="Arial" font-size="20" fill="#076c79">Keep its unit</text><text x="40" y="541" font-family="Arial" font-size="20" fill="#076c79">Do not infer application</text><rect x="20" y="615" width="380" height="220" rx="12" fill="white" stroke="#9db7c7"/><text x="40" y="657" font-family="Arial" font-size="22" fill="#076c79">Vehicle details</text><text x="40" y="700" font-family="Arial" font-size="20" fill="#076c79">Known make and model</text><text x="40" y="743" font-family="Arial" font-size="20" fill="#076c79">Year and engine</text><text x="40" y="786" font-family="Arial" font-size="20" fill="#076c79">Identification if available</text><text x="22" y="905" font-family="Arial" font-size="19" fill="#344d60">One field alone is not a complete</text><text x="22" y="933" font-family="Arial" font-size="19" fill="#344d60">specification.</text></svg>